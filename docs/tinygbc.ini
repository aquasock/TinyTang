# TinyGBC settings.  Read when a cartridge is launched and applied to the
# player.  The TinyGBC window on the desktop writes this file.  A missing
# file, or a missing key, is the default: this file as shipped changes
# nothing.
# 2026-10-22.

[audio]
# One master volume for HDMI and the Line Out together.
volume = 100          # 0 to 100
mute = no
