; /tang.ini -- what is seated in the dock's PMOD sockets.  Copy this to the
; root of the SD card and change it to match.  PMOD modules cannot be detected,
; so a core with the sockets drives only what is declared here; tangload sends
; it after every core load, and `tangini` in the shell shows what it says.
;
; A missing file, or a socket with no entry, leaves the socket released.
;
; Modules: none, oledrgb, encoder, i2s2, i2c, vga_j1, vga_j2.  The PmodVGA is one
; module across both sockets, so vga_j1 and vga_j2 always come as a pair.
; _flip = yes when the module is seated upside down.
;
; Which modules a core takes depends on the core.  The desktop core
; (desktop.bin) takes none, oledrgb or i2c in each socket, or the PmodVGA
; pair, and refuses a declaration that names anything else in either socket,
; leaving both released -- so the encoder below must be none for the desktop
; core to light the OLED.  The I2C bus (`i2c`) carries the desktop clock's RTC;
; set pmod0_flip/pmod1_flip to yes if SDA and SCL are the other way round.  Phosphor takes all six; the TinyNES core reads its
; controllers from PMOD0 and wants the I2S2 on PMOD1.

[tang]
pmod0 = oledrgb
pmod0_flip = no
pmod1 = encoder
pmod1_flip = yes
