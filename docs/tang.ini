; /tang.ini -- what is seated in the dock's PMOD sockets.  Copy this to the
; root of the SD card and change it to match.  PMOD modules cannot be detected,
; so a core with the sockets drives only what is declared here; tangload sends
; it after every core load, and `tangini` in the shell shows what it says.
;
; A missing file, or a socket with no entry, leaves the socket released.
;
; Modules: none, oledrgb, encoder, i2s2, i2c, i2c_uart, vga_j1, vga_j2.  The
; PmodVGA is one module across both sockets, so vga_j1 and vga_j2 always come
; as a pair.  _flip = yes when the module is seated upside down.
;
; Which modules a core takes depends on the core.  The desktop core
; (desktop.bin) takes none, oledrgb, i2c or i2c_uart in each socket -- at most
; one of i2c or i2c_uart -- or the PmodVGA pair, and refuses a declaration that
; names anything else in either socket, leaving both released -- so the
; encoder below must be none for the desktop core to light the OLED.  Phosphor
; takes none, oledrgb, encoder, i2s2, vga_j1 and vga_j2; the TinyNES core
; reads its controllers from PMOD0 and wants the I2S2 on PMOD1.
;
; i2c puts the I2C bus on both rows: SCL on pins 3 and 9, SDA on pins 4 and 10.
; It carries the desktop clock's RTC; set pmod0_flip/pmod1_flip to yes if SDA
; and SCL are the other way round.
;
; i2c_uart is i2c on the upper row only (SCL pin 3, SDA pin 4) plus an 8N1
; UART at 115200 on the lower row: NRST on pin 8, TX on pin 9, RX on pin 10.
; That is where the LoRa module goes; `pmodlora at <text>` talks to it.  An
; I2C Pmod that ties its two rows together must not be seated in this socket,
; because the lower row is the UART's here.

[tang]
pmod0 = oledrgb
pmod0_flip = no
pmod1 = encoder
pmod1_flip = yes
