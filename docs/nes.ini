# TinyNES settings.  Read when a cartridge is launched and applied to the core
# and the player.  The TinyNES Control Deck app on the desktop writes this file.
# A missing file, or a missing key, is the default: this file as shipped
# changes nothing.
# 2026-10-14.

[tinynes]
version = 1

[input]
# Which controller button each NES button answers to, per player.  The names
# are the Classic Controller's: b y up down left right select start.  Only
# these are offered, because only these nine bits of the core's pad word have
# been identified on this board.  HOME is never assignable: it swaps to
# TinyDesk.
p1_a = b            p1_b = y           p1_select = select   p1_start = start
p1_up = up          p1_down = down     p1_left = left       p1_right = right
p2_a = b            p2_b = y           p2_select = select   p2_start = start
p2_up = up          p2_down = down     p2_left = left       p2_right = right

[video]
aspect = 8:7          # 8:7 authentic, 1:1 square, 4:3 stretched
scale = 3             # 3x fills the 720p frame
scanlines = off
palette = fceumm
overscan = hide       # hide or show the top and bottom 8 lines
