; /tinytang.ini -- which PMOD layout is seated in the dock.  Copy this to the root
; of the SD card and keep the one layout line that matches.  PMOD modules
; cannot be detected, so a core with the sockets drives only what is declared
; here; tangload sends it after every core load, and `tangini` in the shell
; shows what it says and what the loaded core took.
;
; Two layouts are supported.  Each module has a fixed socket and is seated
; right side up; nothing is flipped or swapped.
;
;   i2s2_oled  the Pmod I2S2 in PMOD1, the socket beside the HDMI port, and
;              the Pmod OLEDrgb in PMOD0, the socket beside the USB-A ports.
;              The desktop core has no I2S2, so it drives the OLED and leaves
;              PMOD1 released; Phosphor drives both.
;
;   vga        the PmodVGA across both sockets: J1 in PMOD1, J2 in PMOD0.
;
; A missing file, or no layout line, leaves both sockets released.  So does
; an unknown layout, or a pmod0, pmod1, pmod0_flip or pmod1_flip line, which
; earlier firmware read and this one refuses.
[tang]
layout = i2s2_oled
