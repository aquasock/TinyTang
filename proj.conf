# TinyTang SDK configuration.
#
# FreeRTOS is the scheduler the shell's worker primitive uses.  The newlib
# port with its FatFS bridge is what gives the shell stdio for free: fopen,
# fread, stat, mkdir, remove and rename all resolve to "/sd/..." on the SD
# card.  CherryUSB device CDC is the console the user sees.

set(CONFIG_FREERTOS 1)

# The SDK's own logging is off: TinyDesk Shell owns the console, so the
# firmware must not print over it.
set(CONFIG_BFLOG 0)

# newlib + the FatFS port.  CONFIG_NEWLIB_FATFS selects port_file_fatfs.c;
# without it the SDK links no-syscall stubs and the shell has no filesystem.
set(CONFIG_NEWLIB 1)
set(CONFIG_NEWLIB_FATFS 1)
set(CONFIG_VSNPRINTF_FLOAT 1)
set(CONFIG_VSNPRINTF_FLOAT_EX 1)
set(CONFIG_VSNPRINTF_LONG_LONG 1)

# Console: USB CDC-ACM device on the OTG port.
set(CONFIG_CHERRYUSB 1)
set(CONFIG_CHERRYUSB_DEVICE 1)
set(CONFIG_CHERRYUSB_DEVICE_CDC 1)

# Storage: SD card over SDH, with FatFS.
set(CONFIG_FATFS 1)
set(CONFIG_BSP_SDH_SDCARD 1)
set(CONFIG_FATFS_SDH_SDCARD 1)
