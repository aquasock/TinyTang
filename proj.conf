# TinyTang SDK configuration.
#
# FreeRTOS is the scheduler the shell's worker primitive uses.  The newlib
# port with its FatFS bridge is what gives the shell stdio for free: fopen,
# fread, stat, mkdir, remove and rename all resolve to "/sd/..." on the SD
# card.  CherryUSB device CDC is the console the user sees.

set(CONFIG_FREERTOS 1)

# The SDK's own logging is off: TinyDesk Shell owns the console, so the
# firmware must not print over it.
set(CONFIG_BFLOG 0)

# newlib: OFF, and it must stay off.
#
# Enabling the SDK's newlib port (CONFIG_NEWLIB) stops the USB device from
# enumerating on this board.  This was isolated by bisection: the same code and
# every other option unchanged, the device enumerates without it and not with
# it.  Turning CONFIG_NEWLIB_FATFS off as well does not help, so the fault is
# in the newlib port itself rather than only in its FatFS file layer.
#
# That leaves the shell's stdio to us, which is exactly what TinyDesk Shell's
# porting document asks a target to provide: the file calls the core uses
# (fopen/fread/fwrite/fgets/fputs/fseek/ftell/fclose/stat/mkdir/remove/rename/
# unlink/rmdir) are implemented over FatFS in ports/bl616, alongside the
# directory calls already there.
set(CONFIG_NEWLIB 0)
set(CONFIG_NEWLIB_FATFS 0)
set(CONFIG_NEWLIB_STANDARD 0)

# Console: USB CDC-ACM device on the OTG port.
#
# CONFIG_CHERRYUSB_HOST is required even though the board uses the device
# role: with FreeRTOS enabled and only the device stack built, the CDC never
# enumerates on this board, while the same code with the host side compiled in
# does.  The host option is what brings in the FreeRTOS OSAL, so the device
# stack is running without it in the failing case.  This is measured, not
# assumed: it is the single change that took enumeration from failing to
# working, and the working firmware on this board enables it too.
set(CONFIG_CHERRYUSB 1)
set(CONFIG_CHERRYUSB_HOST 1)
set(CONFIG_CHERRYUSB_DEVICE 1)
set(CONFIG_CHERRYUSB_DEVICE_CDC 1)

# Bluetooth LE: the BL616's own radio, for `blescan`, `blekbd` and `blemouse`
# (ports/bl616/tang_ble.c).  The controller library is the SDK's all-roles
# build (observer and central included), the same one examples/btble/central
# uses.  The radio starts at boot when a device is paired, otherwise when one
# of those commands first runs.  CONFIG_BT_SETTINGS stays at its default of 0,
# so the stack keeps nothing in flash and needs no easyflash partition, which
# this board's flash layout does not have: tang_ble.c keeps the pairings on
# the SD card instead (/sd/ble/bonds.bin) and restores them at boot.
set(CONFIG_BLUETOOTH 1)
set(CONFIG_BTBLECONTROLLER_LIB ble1m10s1bredr0)
set(CONFIG_RF 1)
set(CONFIG_BLE_USE_MAC2 0)

# Storage: SD card over SDH, with FatFS.
set(CONFIG_FATFS 1)
set(CONFIG_BSP_SDH_SDCARD 1)
set(CONFIG_FATFS_SDH_SDCARD 1)
