# TinyTang SDK configuration.
#
# Only what this firmware needs.  FreeRTOS is the scheduler the shell's worker
# primitive will use; the console and filesystem configs are added with the
# ports/bl616 milestone.

set(CONFIG_FREERTOS 1)

# The SDK's own logging is off: TinyDesk Shell owns the console, so the
# firmware must not print over it.
set(CONFIG_BFLOG 0)

set(CONFIG_NEWLIB 0)
