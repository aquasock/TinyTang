# Diagnostic configuration: USB device + FreeRTOS, nothing else.  Isolates
# FreeRTOS as the single variable against the minimal build that enumerates.

set(CONFIG_BFLOG 0)
set(CONFIG_FREERTOS 1)

set(CONFIG_CHERRYUSB 1)
set(CONFIG_CHERRYUSB_DEVICE 1)
set(CONFIG_CHERRYUSB_DEVICE_CDC 1)

set(CONFIG_NEWLIB 1)
set(CONFIG_NEWLIB_FATFS 0)
set(CONFIG_NEWLIB_STANDARD 0)
set(CONFIG_FATFS 1)
set(CONFIG_BSP_SDH_SDCARD 1)
set(CONFIG_FATFS_SDH_SDCARD 1)

# One more difference from the working firmware: it enables the host stack,
# which compiles the FreeRTOS OSAL.  Tested here as the last untested delta.
set(CONFIG_CHERRYUSB_HOST 1)
