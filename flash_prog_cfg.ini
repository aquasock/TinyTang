[cfg]
# Erase only the sectors the image occupies.
erase = 1
skip_mode = 0x0, 0x0
boot2_isp_mode = 0

# The Tang Console's vendor bootloader and partition table live below this and
# are left alone; TinyTang occupies the same application slot the previous
# firmware did, so it is flashed exactly the way a firmware update is.
[tinytang]
filedir = ./build/build_out/tinytang_bl616.bin
address = 0x40000
