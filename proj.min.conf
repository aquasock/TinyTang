# Diagnostic configuration: the USB device only.  No FreeRTOS, no FatFS, no
# SDH, no newlib.  This is the closest our project can get to the SDK's own
# working example, so if even this does not enumerate the fault is in the
# project harness rather than in any one option.

set(CONFIG_BFLOG 0)

set(CONFIG_CHERRYUSB 1)
set(CONFIG_CHERRYUSB_DEVICE 1)
set(CONFIG_CHERRYUSB_DEVICE_CDC 1)

set(CONFIG_FREERTOS 0)
set(CONFIG_NEWLIB 0)
set(CONFIG_NEWLIB_FATFS 0)
set(CONFIG_NEWLIB_STANDARD 0)
set(CONFIG_FATFS 0)
set(CONFIG_BSP_SDH_SDCARD 0)
set(CONFIG_FATFS_SDH_SDCARD 0)
