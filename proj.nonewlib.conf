# Diagnostic configuration: everything except the newlib/stdio port, to test
# whether CONFIG_NEWLIB is what keeps the USB device from enumerating.  The
# working firmware for this board (Tang-Control) does not enable it either.

set(CONFIG_FREERTOS 1)
set(CONFIG_BFLOG 0)

set(CONFIG_NEWLIB 0)
set(CONFIG_NEWLIB_FATFS 0)
set(CONFIG_NEWLIB_STANDARD 0)

set(CONFIG_CHERRYUSB 1)
set(CONFIG_CHERRYUSB_DEVICE 1)
set(CONFIG_CHERRYUSB_DEVICE_CDC 1)

set(CONFIG_FATFS 1)
set(CONFIG_BSP_SDH_SDCARD 1)
set(CONFIG_FATFS_SDH_SDCARD 1)
