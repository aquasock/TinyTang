# Release dependency manifest -- schema 1
#
# TinyTang is the root of a release: it carries the BL616 firmware a user flashes
# first, the desktop core, the host tools that load everything else, and the
# patch appliers for the third-party trees.  TinyNES is the application that runs
# on it.  Clone this repository, then run tools/fetch-deps.sh, which materialises
# every dependency below beside it and verifies each one.
#
#   kind  name  pin  url  [dest]
#
#   kind   source     a git repository this script clones and checks out
#          binary     a prebuilt toolchain or bundle
#          generated  produced at build time rather than downloaded
#          vendor     installed by hand under a licence that forbids shipping it
#          reference  not a build input at all; carried for the reader
#   pin    a full 40-character commit SHA, or a SHA-256 for a `binary` or
#          `generated` entry, or UNPINNED when no immutable reference is
#          recorded anywhere yet
#   dest   where it lands, relative to the release root -- the directory that
#          holds this checkout.  Blank means a sibling named for the entry.
#
# An UNPINNED entry is a known gap and not an oversight: the list of them is the
# honest answer to "can this tree build a release".  fetch-deps.sh reports every
# one and, without ALLOW_UNPINNED=1, refuses to finish successfully while any
# remain.  Trailing `# comment` on an entry line is allowed; the parser strips it.

# --- the application ---------------------------------------------------------
# TinyNES is not a dependency of the firmware; it is what the platform runs.  It
# is pinned here so that a release names one commit for the whole bundle.

source  TinyNES        9e1c027a81390b5d616e03055a41ea655ac68920  https://github.com/aquasock/TinyNES.git

# --- the open-flow device toolchain ------------------------------------------
# nextpnr's Gowin architecture is generated from apicula's device database at
# build time, so the two move together and are pinned together.  Both carry this
# project's device work on branch epic/gw5ast138c, whose head is NOT a pin.
# Build: regenerate apicula's chipdb, then rebuild nextpnr against it.

source  apicula        04bc3c5c0e778ac2fbdeb9191a22efe7e6124150  https://github.com/aquasock/apicula.git
source  nextpnr        8be8657b8e9c24355532f1ead78791ea110274dd  https://github.com/aquasock/nextpnr.git

# --- sources the root builds against -----------------------------------------
# The two submodules are recorded in this repository as gitlinks; the SHAs here
# are those gitlinks, so they cannot disagree with the superproject.

source  bouffalo_sdk   8a3df34cb73f459ac71deb1bdf0b33fa016ab6fb  https://github.com/bouffalolab/bouffalo_sdk.git  # 2.3.36; exported as BL_SDK_BASE
source  tinydesk       feaf84130f03594845e5e9284817dca785b4d878  https://github.com/tinydesk-project/tinydesk.git  TinyTang/third_party/tinydesk
source  tinydesk-shell e85ad85b11aac2bf0f609ad346b0e242d4ce4a7d  https://github.com/tinydesk-project/tinydesk-shell.git  TinyTang/third_party/tinydesk-shell

# --- sources TinyNES builds against ------------------------------------------
# Already pinned by TinyNES's own fetch scripts, repeated here so one manifest
