# Release dependency manifest -- schema 1
#
# TinyTang is the root of a release: it carries the BL616 firmware a user flashes
# first, the desktop core, the host tools that load everything else, and the
# patch appliers for the third-party trees.  TinyNES is the application that runs
# on it.  Clone this repository, then run tools/fetch-deps.sh, which materialises
# every dependency below beside it and verifies each one.
#
#   kind  name  pin  url  [dest]
#
#   kind   source     a git repository this script clones and checks out
#          binary     a prebuilt toolchain or bundle
#          generated  produced at build time rather than downloaded
#          vendor     installed by hand under a licence that forbids shipping it
#          reference  not a build input at all; carried for the reader
#   pin    a full 40-character commit SHA, or a SHA-256 for a `binary` entry,
#          or UNPINNED when no immutable reference is recorded anywhere yet
#   dest   where it lands, relative to the release root -- the directory that
#          holds this checkout.  Blank means a sibling named for the entry.
#
# An UNPINNED entry is a known gap and not an oversight: the list of them is the
# honest answer to "can this tree build a release".  fetch-deps.sh reports every
# one and, without ALLOW_UNPINNED=1, refuses to finish successfully while any
# remain.  Trailing `# comment` on an entry line is allowed; the parser strips it.

# --- the application ---------------------------------------------------------
# TinyNES is not a dependency of the firmware; it is what the platform runs.  It
# is pinned here so that a release names one commit for the whole bundle.

source  TinyNES        fa557f42630125d3c17128c4b5919dfbc429be29  https://github.com/aquasock/TinyNES.git

# --- the open-flow device toolchain ------------------------------------------
# nextpnr's Gowin architecture is generated from apicula's device database at
# build time, so the two move together and are pinned together.  Both carry this
# project's device work on branch epic/gw5ast138c, whose head is NOT a pin.
# Build: regenerate apicula's chipdb, then rebuild nextpnr against it.

source  apicula        cd3893f76f40bb972aa3053b1887b10d5b893e9e  https://github.com/aquasock/apicula.git
source  nextpnr        7d1b131cdc68c3aeb453d87b6545dff3784620cc  https://github.com/aquasock/nextpnr.git

# --- sources the root builds against -----------------------------------------
# The two submodules are recorded in this repository as gitlinks; the SHAs here
# are those gitlinks, so they cannot disagree with the superproject.

source  bouffalo_sdk   8a3df34cb73f459ac71deb1bdf0b33fa016ab6fb  https://github.com/bouffalolab/bouffalo_sdk.git  # 2.3.36; exported as BL_SDK_BASE
source  tinydesk       feaf84130f03594845e5e9284817dca785b4d878  https://github.com/tinydesk-project/tinydesk.git  TinyTang/third_party/tinydesk
source  tinydesk-shell a067fa78ec491862c016e0b60b4b7fc684304a43  https://github.com/tinydesk-project/tinydesk-shell.git  TinyTang/third_party/tinydesk-shell
source  nestang        UNPINNED                                    https://github.com/nand2mario/nestang.git  # the NES and menu cores only; no commit recorded anywhere

# --- sources TinyNES builds against ------------------------------------------
# Already pinned by TinyNES's own fetch scripts, repeated here so one manifest
# describes the whole release.

source  fceumm         ac0d00a7fc01166f84c7bac01d1084ebfd2b865e  https://github.com/libretro/libretro-fceumm.git  TinyNES/third_party/fceumm
source  font8x8        8e279d2d864e79128e96188a6b9526cfa3fbfef9  https://github.com/dhepper/font8x8.git  TinyNES/third_party/font8x8

# --- prebuilt toolchains -----------------------------------------------------
# None carries a recorded checksum today.  None can be built from a repository:
# these are the entries a release has to solve by publishing an archive with its
# digest, or by accepting the gap in the release notes.

binary  oss-cad-suite  UNPINNED  https://github.com/YosysHQ/oss-cad-suite-build/releases  # in use: 20261008; yosys 0.69+260, openFPGALoader v1.1.1, apycula 0.34
binary  xpack-riscv-none-elf-gcc  UNPINNED  https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases  # in use: 15.2.0-1; builds the AE350 firmware inside the TinyNES core
binary  xuantie-900-gcc  UNPINNED  UNRECORDED  # in use: Xuantie-900 elf newlib gcc Toolchain V2.6.1 B-20220906, GCC 10.2.0; builds the BL616 firmware.  Where this came from is not written down anywhere.

# --- generated at build time -------------------------------------------------
# The device database nextpnr embeds, generated by apicula from Gowin EDA's own
# device files (GOWINHOME/IDE/share/device/GW5AST-138C/: the .fse and the .dat).
# This is the entry that cost the desktop core its rebuildability on 2026-10-13:
# nothing tracked the result, and a database generated later gave a different
# timing model and different clock routing for byte-identical source.
#
# The digest below was taken from a generation by apicula cd3893f under Gowin EDA
# 1.9.11.03, and then checked by regenerating from the same commit and comparing:
# it reproduces byte for byte.  For anyone with that same Gowin version this is a
# real pin, and it turns a silent drift into a loud failure.
#
# It is not a solution.  A builder who cannot install Gowin EDA cannot generate
# the file at all, and one whose Gowin differs fails this check.  A school with no
# vendor software on the machine still cannot build this from scratch.  Shipping
# the database instead is the next release's question, and it is a licensing
# decision before it is an engineering one.
#
# Recipe: GOWINHOME=<install> PYTHONPATH=<apicula>:<pydeps> python3 -m
#         apycula.chipdb_builder GW5AST-138C

generated  gw5ast138c-chipdb  446b89c0e96e8cd6b3178aece308200d6c4190fef31d90f1a13725bc3f9aa6ef  apicula:apycula/GW5AST-138C.msgpack.xz

# --- named, not built, not shipped -------------------------------------------
# Gowin EDA is needed only for comparison builds and the nestang-derived cores.
# A release cannot redistribute it, so it names the version it was checked
# against and stops there.

vendor  gowin-eda-1.9.11.03  UNPINNED-nonfree  UNRECORDED  # comparison builds only

# --- read, not built ---------------------------------------------------------
# Tang-Build holds the research record: the findings, the raw evidence, and the
# toolchain document this manifest replaces.  Nothing links against it.

reference  Tang-Build  737ddb4ca345bca80c6afc39fb26509196afe625  https://github.com/aquasock/Tang-Build.git
