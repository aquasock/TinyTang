# --- prebuilt toolchains -----------------------------------------------------
# None can be built from a repository, so each is pinned as the release archive
# itself: the pin is the archive's SHA-256 and the location is its download URL.
# fetch-deps.sh downloads it, refuses it if the digest differs, and unpacks it
# into the destination.  Each digest below agrees with the one the publisher
# shows for the asset, and each archive was unpacked and compared with the tree
# this project has been building with: the xPack and Xuantie trees are identical
# file for file, and oss-cad-suite differs only in Python bytecode caches.
#
# The Xuantie compiler needs its history kept here.  The copy every build so far
# used is a git checkout of bouffalolab/toolchain_gcc_t-head_linux at c4afe91
# ("update to v2.6.1 20220906").  On 2026-10-12 Bouffalo replaced that
# repository's history with a README pointing at the release below, so c4afe91
# is on no branch any more: it can still be fetched by its SHA today, but nothing
# keeps it.  The release tag `default` is not immutable either -- an asset under
# it was replaced a day after it was published -- which is why the archive is
# pinned by its digest and not by the tag.

binary  oss-cad-suite  8fa59d93d6cadbbee352077c059f2c5b72cda301e4508d9064a23d1ec11579c7  https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-10-08/oss-cad-suite-linux-x64-20261008.tgz  # yosys 0.69+260, openFPGALoader v1.1.1, apycula 0.34
binary  xpack-riscv-none-elf-gcc  aaaa8060c914851a3e5ee1ba82cc3d6f80972f90638a05c6e823a37557a33758  https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v15.2.0-1/xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64.tar.gz  # 15.2.0-1; builds the AE350 firmware inside the TinyNES core
binary  xuantie-900-gcc  83817bd7cab693fc249bb98869de5e475c1ede577f4a188869fed96c8dbb8e1a  https://github.com/bouffalolab/toolchain/releases/download/default/xuantie-gcc-riscv-v2.6.1-linux-x86_64.tar.xz  # Xuantie-900 elf newlib gcc V2.6.1 B-20220906, GCC 10.2.0; builds the BL616 firmware

# --- generated at build time -------------------------------------------------
# The device database nextpnr embeds, generated by apicula from Gowin EDA's own
# device files (GOWINHOME/IDE/share/device/GW5AST-138C/: the .fse and the .dat).
# This is the entry that cost the desktop core its rebuildability on 2026-10-13:
# nothing tracked the result, and a database generated later gave a different
# timing model and different clock routing for byte-identical source.
#
# The digest below was taken from a generation by apicula 495661a under Gowin EDA
# 1.9.11.03 (core-log entry 88).  The recipe in the comment below reproduces it
# exactly on a machine with that Gowin install; that was verified by
# regenerating it from a clean worktree at the pinned commit and comparing, and
# the result is what the build in use reads.  The previous pin, aecb123e (from
# apicula 04bc3c5), also regenerates byte for byte from the same Gowin install
# and differs only because apicula's architecture tables changed; it is kept in
# BUILDING.md with the ABI 1.3 core it built.
#
# The database is a derivative of the vendor's device files: chipdb_builder
# parses $GOWINHOME/IDE/share/device/GW5AST-138C/{.fse,.dat,.tm}.  That is why
# this entry is `generated` and not `source`, why a clone alone cannot produce a
# bitstream, and why what the repository carries is the digest and the recipe
# rather than the file.  See THIRD_PARTY.md.
#
# It is still not a solution for someone without the vendor install.  Shipping
# the database instead is a licensing decision before it is an engineering one,
# and remains open.
#
# Recipe: GOWINHOME=<install> PYTHONPATH=<apicula>:<pydeps> python3 -m
#         apycula.chipdb_builder GW5AST-138C

generated  gw5ast138c-chipdb  e74b77e429e9be2e176477fa4d3c9984a1bdee8a17dad5dd3ab80620aefe175b  apicula:apycula/GW5AST-138C.msgpack.xz

# --- named, not built, not shipped -------------------------------------------
# Gowin EDA is needed only for comparison builds.
# A release cannot redistribute it, so it names the version it was checked
# against and stops there.

vendor  gowin-eda-1.9.11.03  UNPINNED-nonfree  UNRECORDED  # comparison builds only

